  <!-- Icons -->
  <!--
    LA MARCA DEL PNMC, NO LA DE ANGULAR. Hasta este `favicon.ico` era
    el que deja `ng new`: el logotipo de Angular en rosa y morado. No es un descuido de este
    desarrollo —el de el diseño aprobado del portal y el de un desarrollo anterior llevan el mismo— pero es lo primero que se ve de
    un sitio, en la pestaña y en los marcadores.

    LOS DOS FICHEROS SE GENERAN, NO SE DIBUJAN A MANO: `tools/genera-favicon.py` los saca de
    `public/Icono PNMC Negro.png`, la marca de 2000x2000 que ya estaba en el proyecto, teñida con
    el morado del tema. El script explica por qué engrosa las crestas antes de reducir; en corto:
    la tinta cubre el 15 % del lienzo y a 16 px el promedio se la come.

    Si cambia la marca, se sustituye ese PNG y se vuelve a ejecutar el script.
  -->
  <!--
    EL PNG VA PRIMERO Y EL `.ICO` QUEDA DE RESPALDO, y el orden importa por una razón concreta: un
    navegador guarda el icono POR SU URL y lo conserva con muchísima insistencia. Cambiar el
    contenido de `/favicon.ico` deja a quien ya visitó el sitio viendo el anterior durante días;
    estas direcciones son nuevas, así que entran a la primera. Los navegadores modernos además
    prefieren el PNG declarado con su medida.
  -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icono-pnmc-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icono-pnmc-192.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
